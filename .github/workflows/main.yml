name: Build Lumen DLL

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Find and Build
      shell: pwsh
      run: |
        Write-Host "Searching for CMakeLists.txt..."
        $cmakeFile = Get-ChildItem -Path . -Filter "CMakeLists.txt" -Recurse | Select-Object -First 1

        if ($null -eq $cmakeFile) {
            Write-Error "Could not find CMakeLists.txt anywhere in the repository!"
            exit 1
        }

        $sourceDir = $cmakeFile.DirectoryName
        Write-Host "Found CMakeLists.txt at: $sourceDir"

        cmake -B build -S $sourceDir -A x64
        cmake --build build --config Release

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: Lumen-DLL
        path: build/bin/Release/Lumen.dll
