name: Build Lumen DLL

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Find CMakeLists.txt
      run: |
        echo "Searching for CMakeLists.txt..."
        dir /s /b CMakeLists.txt

    - name: Configure CMake
      run: |
        $path = (dir /s /b CMakeLists.txt | Split-Path -Parent)
        echo "Building from: $path"
        cmake -B build -S $path -A x64

    - name: Build Project
      run: cmake --build build --config Release

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: Lumen-DLL
        path: build/bin/Release/Lumen.dll
